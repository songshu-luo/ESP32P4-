# 泰山派本地 Hub —— Mosquitto Broker 配置 v1
#
# 定位：局域网内唯一 MQTT Broker（方案 §5.2 / ADR-04）。
# 红线：禁止匿名；1883 一律不得做公网端口映射（方案 §9.2 / 交接 §7）。
#
# 安装到 /etc/mosquitto/conf.d/taishan-hub.conf
# 凭据与 ACL 在 /etc/taishan-hub/（root:mosquitto 750）
#
# 注意：persistence / log_dest / include_dir 已由发行版默认的
# /etc/mosquitto/mosquitto.conf 提供，这里不重复，避免配置打架。

allow_anonymous false
password_file /etc/taishan-hub/mosquitto.passwd
acl_file      /etc/taishan-hub/mosquitto.acl

listener 1883 0.0.0.0
protocol mqtt

# 让运维能用 mosquitto_sub -t '$SYS/#' 看 broker 自身状态
sys_interval 10

# 防止异常客户端长期占用
max_keepalive 120
